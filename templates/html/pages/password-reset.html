{{define "title"}}Password reset{{end}}

{{define "main"}}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="mv-panel p-4 p-md-5">
            <h1 class="h3 mb-3">Reset your password</h1>
            <p class="text-body-secondary mb-4">Enter the token from the email link and choose a new password.</p>

            <form onsubmit="return resetPassword(event)">
                <div class="mb-3">
                    <label class="form-label" for="reset-token">Token</label>
                    <input class="form-control" id="reset-token" name="token" type="text" value="{{.ResetToken}}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="reset-password">New password</label>
                    <input class="form-control" id="reset-password" name="password" type="password" minlength="8" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Update password</button>
                <div id="passwordResetMessage" class="mt-3"></div>
            </form>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
    async function resetPassword(event) {
        event.preventDefault();

        const token = document.getElementById('reset-token')?.value || '';
        const password = document.getElementById('reset-password')?.value || '';
        const response = await fetch('/v1/accounts/password-reset', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token, password}),
        });

        const messageNode = document.getElementById('passwordResetMessage');
        if (!response.ok) {
            if (messageNode) {
                messageNode.className = 'mt-3 alert alert-danger py-2 px-3 mb-0';
                messageNode.textContent = 'Unable to reset the password.';
            }
            return false;
        }

        if (messageNode) {
            messageNode.className = 'mt-3 alert alert-success py-2 px-3 mb-0';
            messageNode.textContent = 'Password updated. You can log in again now.';
        }
        setTimeout(() => { window.location.href = '/user/login'; }, 1200);
        return false;
    }
</script>
{{end}}
