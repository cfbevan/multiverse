{{define "title"}}Blog{{end}}

{{define "main"}}
<div class="row g-4">
    <div class="col-lg-8">
        <div class="mv-panel p-3 p-md-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
                <h1 class="h2 mb-0">Blog</h1>
                <div class="btn-group" role="group" aria-label="Blog feed selector" data-feed-selector>
                    {{ $feed := .Feed }}
                    <button class="btn btn-sm {{if eq $feed "my"}}btn-primary{{else}}btn-outline-primary{{end}} d-none" type="button" data-feed-value="my" data-auth-state="authenticated" hx-get="/blog/partials/list?feed=my" hx-target="#blogList" hx-swap="innerHTML" hx-push-url="/blog?feed=my" hx-headers='js:{"Authorization": "Bearer " + localStorage.getItem("multiverse-token")}' >My Feed</button>
                    <button class="btn btn-sm {{if eq $feed "local"}}btn-primary{{else}}btn-outline-primary{{end}}" type="button" data-feed-value="local" hx-get="/blog/partials/list?feed=local" hx-target="#blogList" hx-swap="innerHTML" hx-push-url="/blog?feed=local">Local</button>
                    <button class="btn btn-sm {{if eq $feed "federated"}}btn-primary{{else}}btn-outline-primary{{end}}" type="button" data-feed-value="federated" hx-get="/blog/partials/list?feed=federated" hx-target="#blogList" hx-swap="innerHTML" hx-push-url="/blog?feed=federated">Federated</button>
                    <button class="btn btn-sm {{if eq $feed "trending"}}btn-primary{{else}}btn-outline-primary{{end}}" type="button" data-feed-value="trending" hx-get="/blog/partials/list?feed=trending" hx-target="#blogList" hx-swap="innerHTML" hx-push-url="/blog?feed=trending">Trending</button>
                </div>
            </div>
            <div id="blogList" hx-get="/blog/partials/list?feed={{.Feed}}" hx-trigger="load" hx-swap="innerHTML"></div>
        </div>
    </div>
    <div class="col-lg-4 d-none" data-auth-state="authenticated">
        <div class="mv-panel p-3 p-md-4">
            <h2 class="h5">Create Article</h2>
            <p class="text-body-secondary small mb-3">Write a new article to share with the community.</p>
            {{template "blogPostForm" .}}
            <div id="blogFormFeedback" class="mt-3"></div>
        </div>
    </div>
</div>
{{end}}
