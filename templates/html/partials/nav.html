{{define "nav"}}
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Multiverse</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-co llapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
            </ul>
            {{if .IsAuthenticated}}
                <li class="nav-item">
                    <a class="nav-link" href="/snippet/create">Create snippet</a>
                </li>
            {{end}}
        </div>
        <div class="d-flex">
            {{if .IsAuthenticated}}
                <form action='/user/logout' method='POST'>
                    <input type='hidden' name='csrf_token' value='{{.CSRFToken}}'>
                    <button class="btn btn-outline-success" type="submit">Logout</button>
                </form>
            {{else}}
                <a class="btn btn-outline-success" href='/user/signup'>Signup</a>
                <a class="btn btn-outline-success" href='/user/login'>Login</a>
            {{end}}
        </div>
    </div>
</nav>
{{end}}
